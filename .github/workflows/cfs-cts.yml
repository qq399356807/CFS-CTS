name: CFS-CTS Core CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src tests
      - name: Verify source checksums
        run: python verify_checksums.py
      - name: Run adversarial suite
        run: python run_tests.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfs-cts-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/test_report.json
            reports/test_report.md
          if-no-files-found: warn
          retention-days: 30
